site_name: WiFi Cracking
site_description: Complete technical reference for IEEE 802.11 security — protocols, attacks, and hash extraction
site_url: https://strongwind.dev/WiFi_Cracking/
repo_url: https://github.com/StrongWind1/WiFi_Cracking
repo_name: StrongWind1/WiFi_Cracking
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 - 2026 StrongWind1

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark mode (default) — respects system preference
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode — respects system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    # Deviation from the shared baseline: this is a reference site with a
    # four-level nav, so the top-level sections become tabs rather than one
    # very long sidebar. Kerberos does the same for the same reason.
    - navigation.tabs
    - navigation.tabs.sticky
    # Table of contents
    - toc.follow
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Header
    - header.autohide
    - announce.dismiss
    # Content
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

plugins:
  - search
  # Downloads the Google Fonts requested by theme.font at build time so the
  # published site makes no third-party requests.
  - privacy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  # Project-specific: the content relies on emoji shortcodes, the shared
  # abbreviation glossary, and <abbr> expansion.
  - abbr
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md

nav:
  - Home: index.md
  - Guide:
      - guide/index.md
      - Adapters and Linux setup: guide/adapters.md
      - WEP Cracking: guide/wep.md
      - WPA/WPA2 Cracking: guide/wpa.md
      - WPA-Enterprise (EAP): guide/eap.md
      - Cheat Sheets:
          - WPAWolf: guide/cheatsheet-wpawolf.md
          - WEPWolf: guide/cheatsheet-wepwolf.md
          - hcxdumptool: guide/cheatsheet-hcxdumptool.md
          - hashcat: guide/cheatsheet-hashcat.md
  - Reference:
      - Protocol:
          - protocol/index.md
          - Security matrix: protocol/security-matrix.md
          - Key hierarchy: protocol/key-hierarchy.md
          - 4-way handshake: protocol/four-way-handshake.md
          - PSK (AKM 2, 6, 20): protocol/psk-family.md
          - FT-PSK (AKM 4, 19): protocol/ft-psk-family.md
          - SAE (AKM 8, 9, 24, 25): protocol/sae-family.md
          - Enterprise (AKM 1, 3, 5, 11-13, 22, 23): protocol/enterprise-family.md
          - FILS (AKM 14-17): protocol/fils-family.md
          - Other (OWE, TDLS, PASN): protocol/other-family.md
      - PSK Attacks:
          - psk-attacks/index.md
          - PMKID attack: psk-attacks/pmkid.md
          - EAPOL attack: psk-attacks/eapol.md
          - Algorithms: psk-attacks/algorithms.md
      - EAP Attacks:
          - eap-attacks/index.md
          - PEAP / MSCHAPv2: eap-attacks/peap-mschapv2.md
          - EAP-MD5: eap-attacks/eap-md5.md
          - Cisco LEAP: eap-attacks/leap.md
      - WEP:
          - wep/index.md
          - Aircrack-ng workflow: wep/aircrack-workflow.md
      - Tools:
          - tools/index.md
          - hcxpcapngtool: tools/hcxpcapngtool.md
          - wpawolf: tools/wpawolf.md
          - hashcat: tools/hashcat.md
          - Aircrack-ng suite: tools/aircrack-suite.md
          - hostapd-mana: tools/hostapd-mana.md
      - Appendix:
          - reference/index.md
          - EAPOL-Key frame: reference/eapol-frame.md
          - Capture requirements: reference/capture-requirements.md
          - Hash extraction reference: reference/hash-extraction.md
          - Gap table: reference/gap-table.md
          - Glossary: reference/glossary.md
      - Meta:
          - Contributing: meta/contributing.md
          - Changelog: meta/changelog.md

exclude_docs: |
  includes/
  old/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StrongWind1/WiFi_Cracking
      name: WiFi Cracking on GitHub
  generator: false

extra_css:
  # theme.css is the site palette; primary and accent are both `custom`,
  # so every Material colour variable is defined there.
  - stylesheets/theme.css
  - stylesheets/extra.css

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
