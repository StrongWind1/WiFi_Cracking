name: Docs

# This repository is a documentation site: the built site IS the product.
# Every push to main and every PR builds the docs strictly (the test); pushes
# to main additionally deploy the site to GitHub Pages.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Build docs (strict)
        run: |
          set -euo pipefail
          uv run --group docs mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy docs to Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Pushes to main publish automatically; workflow_dispatch republishes on
    # demand without needing an empty commit.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint YAML
        run: |
          set -euo pipefail
          # Whole repo, not just .github -- mkdocs.yml is the file most likely to
          # be hand-edited. .yamllint.yml scopes the walk via yaml-files and
          # ignore-from-file.
          python3 -m pip install --user --quiet yamllint
          python3 -m yamllint --strict -c .yamllint.yml .

  actionlint:
    name: Action lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
